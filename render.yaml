# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy from Dashboard → New → Blueprint → connect this repo, or use `render deploy`.
services:
  - type: web
    name: ai-interviewer-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: /var/data/app.db
    disk:
      name: ai-interviewer-data
      mountPath: /var/data
      sizeGB: 1
